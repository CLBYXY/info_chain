<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/></marker></defs><rect width="1100" height="480" fill="#FFFFFF"/><text x="20.0" y="26.0" font-size="16" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">图 3 · ③ 证据层：从文档中拆出句子，判定类型，整理成声明卡片</text><rect x="20.0" y="56.0" width="370.0" height="170.0" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><rect x="20.0" y="56.0" width="370.0" height="34.0" rx="8" fill="#F1EFE8" stroke="none" stroke-width="1"/><text x="36.0" y="73.0" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">某自媒体文章 · 10-20 09:12</text><text x="36.0" y="118.0" font-size="13" font-weight="400" fill="#888780" text-anchor="start" dominant-baseline="central">近日市场对 Y 公司关注度升温。</text><rect x="37.0" y="144.2" width="202.2" height="19.5" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/><text x="40.0" y="154.0" font-size="13" font-weight="600" fill="#92400E" text-anchor="start" dominant-baseline="central">据知情人士透露，X 将收购 Y。</text><text x="36.0" y="190.0" font-size="13" font-weight="400" fill="#888780" text-anchor="start" dominant-baseline="central">业内人士认为此举影响深远。</text><line x1="392.0" y1="154.0" x2="428.0" y2="154.0" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><rect x="432.0" y="56.0" width="300.0" height="170.0" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="582.0" y="84.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">硬规则（不调用 LLM）</text><text x="582.0" y="118.0" font-size="13" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">命中匿名信源词“据知情人士”</text><text x="582.0" y="146.0" font-size="14" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">↓</text><text x="582.0" y="174.0" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">可选类型只剩 {传闻} → 直接定类</text><line x1="734.0" y1="141.0" x2="766.0" y2="141.0" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><rect x="20.0" y="268.0" width="370.0" height="170.0" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><rect x="20.0" y="268.0" width="370.0" height="34.0" rx="8" fill="#F1EFE8" stroke="none" stroke-width="1"/><text x="36.0" y="285.0" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">X 公司澄清公告 · 10-22 19:30</text><text x="36.0" y="330.0" font-size="13" font-weight="400" fill="#888780" text-anchor="start" dominant-baseline="central">近日，有媒体报道公司拟收购 Y 公司。</text><rect x="37.0" y="356.2" width="277.2" height="19.5" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/><text x="40.0" y="366.0" font-size="13" font-weight="600" fill="#92400E" text-anchor="start" dominant-baseline="central">经核实，公司目前未筹划收购 Y 公司事项。</text><text x="36.0" y="402.0" font-size="13" font-weight="400" fill="#888780" text-anchor="start" dominant-baseline="central">敬请广大投资者注意投资风险。</text><line x1="392.0" y1="366.0" x2="428.0" y2="366.0" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><rect x="432.0" y="268.0" width="300.0" height="74.0" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="582.0" y="292.0" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">硬规则：来源 = 公司公告</text><text x="582.0" y="318.0" font-size="13" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">可选类型 {事实, 推测}</text><line x1="582.0" y1="344.0" x2="582.0" y2="362.0" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><rect x="432.0" y="364.0" width="300.0" height="74.0" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="582.0" y="388.0" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">软判定：LLM 在两项中选，判 3 次</text><text x="582.0" y="414.0" font-size="13" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">事实 / 事实 / 事实 → 一致，采纳</text><line x1="734.0" y1="401.0" x2="766.0" y2="401.0" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><rect x="770.0" y="56.0" width="310.0" height="170.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><rect x="786.0" y="70.0" width="40.0" height="20.0" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1"/><text x="806.0" y="80.0" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="middle" dominant-baseline="central">传闻</text><text x="786.0" y="112.0" font-size="12" font-weight="400" fill="#888780" text-anchor="start" dominant-baseline="central">表述</text><text x="852.0" y="112.0" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">X 将收购 Y</text><text x="786.0" y="138.0" font-size="12" font-weight="400" fill="#888780" text-anchor="start" dominant-baseline="central">来源</text><text x="852.0" y="138.0" font-size="13" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">某自媒体 · 10-20 09:12</text><text x="786.0" y="164.0" font-size="12" font-weight="400" fill="#888780" text-anchor="start" dominant-baseline="central">原文</text><text x="852.0" y="164.0" font-size="13" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">已回查 ✓</text><text x="786.0" y="190.0" font-size="12" font-weight="400" fill="#888780" text-anchor="start" dominant-baseline="central">事件时间</text><text x="852.0" y="190.0" font-size="13" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">未提及</text><rect x="770.0" y="300.0" width="310.0" height="170.0" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/><rect x="786.0" y="314.0"